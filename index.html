<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oops... Please Don't Block Me 😂</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:linear-gradient(135deg,#dbeafe,#ffffff);
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

}

.container{

    position:relative;
    z-index:10;
    padding:20px;

}

h1{

    color:#1e3a8a;
    margin-bottom:20px;
    font-size:clamp(2rem,8vw,3rem);

}

h2{

    color:#1e3a8a;
    margin-bottom:25px;
    font-size:1.8rem;

}

p{

    color:#555;
    font-size:1.15rem;
    line-height:1.7;
    margin-bottom:20px;

}

img{

    width:260px;
    max-width:80vw;
    border-radius:18px;
    margin-bottom:20px;

}

button{

    border:none;
    border-radius:14px;
    cursor:pointer;
    transition:.3s;

}

#yesBtn{

    background:#2563eb;
    color:white;
    padding:15px 35px;
    font-size:22px;
    margin-right:15px;

}

#yesBtn:hover{

    background:#1d4ed8;

}

#noBtn{

    background:#dddddd;
    color:#333;
    padding:15px 35px;
    font-size:22px;
    position:relative;

}

.float{

    position:absolute;
    pointer-events:none;
    user-select:none;
    animation:float 8s linear infinite;

}

@keyframes float{

from{

transform:translateY(100vh);

}

to{

transform:translateY(-120px);

}

}

</style>

</head>

<body>

<div class="container">

<h1>My Bad 😂</h1>

<img
src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
alt="Funny Cat">

<p>

I made a tiny mistake...

<br><br>

Okay... maybe not THAT tiny. 😅

<br><br>

No excuses.

Just hoping you won't disappear after this.

</p>

<h2>

Can we still text each other? 🥹

</h2>

<button id="yesBtn">

Alright 😌

</button>

<button id="noBtn">

Nope 😂

</button>

</div>

<script>

const emojis=[

"😂","🤣","🥲","🤡","🍌","🐸","🐥","🐱","🦆","🍪",
"🗿","💀","😎","🙃","🎉","🍕","🐢","🦖","🦭","🐔"

];

for(let i=0;i<40;i++){

let e=document.createElement("div");

e.className="float";

e.innerHTML=emojis[
Math.floor(Math.random()*emojis.length)
];

e.style.left=Math.random()*100+"vw";

e.style.fontSize=(18+Math.random()*20)+"px";

e.style.animationDuration=
(5+Math.random()*5)+"s";

document.body.appendChild(e);

}
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");

let count = 0;
let yesSize = 22;

const messages = [

"NO 😂",
"Are you sure? 🤨",
"Think again 🤣",
"404 Forgiveness Not Found 💀",
"Mission Failed 🚫",
"Go apologize harder 😂",
"Still nope 🐸",
"You missed! 🤡",
"Catch me first 🏃",
"Loading forgiveness... 1%",
"Try again 🍌",
"Access Denied 🚫",
"Not today 😏",
"Bruh 😂",
"Okay... SIKE 🤣"

];

function moveButton(){

    noBtn.style.position = "fixed";

    const maxX =
        window.innerWidth -
        noBtn.offsetWidth -
        20;

    const maxY =
        window.innerHeight -
        noBtn.offsetHeight -
        20;

    noBtn.style.left =
        Math.random() * maxX + "px";

    noBtn.style.top =
        Math.random() * maxY + "px";

    noBtn.innerHTML =
        messages[count % messages.length];

    count++;

    yesSize += 7;

    yesBtn.style.fontSize =
        yesSize + "px";

    yesBtn.style.padding =
        (15 + count * 2) +
        "px " +
        (35 + count * 3) +
        "px";

    yesBtn.style.transform =
        `scale(${1 + count * 0.05})`;

}

noBtn.addEventListener(
    "mouseover",
    moveButton
);

noBtn.addEventListener(
    "click",
    function(e){

        e.preventDefault();

        moveButton();

    }
);

noBtn.addEventListener(
    "touchstart",
    function(e){

        e.preventDefault();

        moveButton();

    }
);

yesBtn.addEventListener("click",()=>{

    for(let i=0;i<120;i++){

        let emoji=document.createElement("div");

        emoji.innerHTML=
        emojis[Math.floor(Math.random()*emojis.length)];

        emoji.style.position="fixed";
        emoji.style.left=Math.random()*100+"vw";
        emoji.style.top="-20px";
        emoji.style.fontSize=(20+Math.random()*20)+"px";
        emoji.style.pointerEvents="none";
        emoji.style.zIndex="9999";

        document.body.appendChild(emoji);

        emoji.animate(

            [
                {
                    transform:"translateY(0px) rotate(0deg)",
                    opacity:1
                },
                {
                    transform:
                    `translateY(${window.innerHeight+120}px) rotate(720deg)`,
                    opacity:0
                }
            ],

            {
                duration:2500+Math.random()*2000,
                iterations:1
            }

        );

        setTimeout(()=>{
            emoji.remove();
        },5000);

    }
      setTimeout(()=>{

        document.body.innerHTML=`

<div style="
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
background:linear-gradient(135deg,#dbeafe,#ffffff);
padding:20px;
text-align:center;
">

<h1 style="
color:#1e3a8a;
font-size:clamp(2rem,8vw,4rem);
margin-bottom:20px;
">

🏆 Achievement Unlocked! 😂

</h1>

<img
src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif"
style="
width:300px;
max-width:80vw;
border-radius:20px;
">

<h2 style="
color:#1e3a8a;
margin-top:20px;
">

You Didn't Block Me! 🥳

</h2>

<p style="
margin-top:20px;
font-size:1.2rem;
color:#555;
line-height:1.8;
">

Thanks for giving me another chance!

<br><br>

I promise to think before I do something goofy...

<br><br>

...at least once a week. 🤣

</p>

<p style="
margin-top:25px;
color:#666;
font-size:1rem;
">

Patch Notes v1.0 🛠️

<br>

✔ Increased brain usage by 5%

<br>

✔ Reduced weirdness by 0.01%

<br>

✔ Hopefully less annoying 😂

</p>

</div>

`;

    },1200);

});
  </script>

</body>

</html>
