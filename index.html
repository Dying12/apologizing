<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Tiny Invitation ☕</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}

html{
    scroll-behavior:smooth;
}


body{

    background:linear-gradient(135deg,#dbeafe,#ffffff);

    min-height:100vh;

    overflow-x:hidden;
    overflow-y:auto;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    padding:50px 20px;

    position:relative;

}


/* Floating Emojis */

.float{

    position:absolute;

    pointer-events:none;

    user-select:none;

    animation:float linear infinite;

    opacity:.85;

}


@keyframes float{

    0%{

        transform:translateY(110vh) rotate(0deg);

        opacity:0;

    }


    10%{

        opacity:1;

    }


    100%{

        transform:translateY(-120px) rotate(360deg);

        opacity:0;

    }

}



/* Main Card */


.container{

    width:min(92%,720px);

    margin:40px auto;

    background:rgba(255,255,255,.62);

    backdrop-filter:blur(16px);

    border-radius:30px;

    padding:40px;

    text-align:center;

    box-shadow:
    0 15px 40px rgba(0,0,0,.12);

    animation:pop .8s ease;

    z-index:5;

}



@keyframes pop{

from{

    opacity:0;

    transform:translateY(30px) scale(.95);

}


to{

    opacity:1;

    transform:translateY(0) scale(1);

}

}



.fade{

animation:fade .8s ease;

}



@keyframes fade{

from{

    opacity:0;

    transform:translateY(20px);

}


to{

    opacity:1;

    transform:translateY(0);

}

}



/* Text */


h1{

    font-size:clamp(2rem,7vw,3.8rem);

    color:#1e3a8a;

    margin-bottom:20px;

}



h2{

    margin-top:30px;

    font-size:1.8rem;

    color:#1e3a8a;

}



p{

    font-size:1.15rem;

    line-height:1.9;

    color:#555;

    margin-top:20px;

    white-space:pre-line;

}



/* Image */


img{

    width:280px;

    max-width:85vw;

    border-radius:24px;

    margin-top:25px;

    box-shadow:

    0 10px 25px rgba(0,0,0,.18);

}



/* Buttons */


button{

    border:none;

    border-radius:16px;

    cursor:pointer;

    transition:.35s;

    padding:16px 35px;

    font-size:22px;

    margin:20px 10px;

}



#yesBtn{

    background:#2563eb;

    color:white;

}



#yesBtn:hover{

    background:#1d4ed8;

    transform:scale(1.05);

}



#noBtn{

    background:#dddddd;

    color:#333;

    position:relative;

}



/* Footer */


footer{

    margin-top:35px;

    font-size:.95rem;

    color:#777;

}



/* Mobile */


@media(max-width:600px){


body{

    padding:30px 15px;

}



.container{

    padding:25px 20px;

    margin:20px auto;

}



button{

    width:90%;

    font-size:20px;

}



h2{

    font-size:1.4rem;

}



p{

    font-size:1rem;

}


}


</style>

</head>


<body>


<div class="container" id="card">


<h1 id="title">

Loading...

</h1>



<img

id="gif"

src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif"

alt="Cute Cat"

>



<p id="text">

Preparing something...

</p>



<div id="buttons" style="display:none;">


<h2>

Want to hang out with me? ☕✨

</h2>


<button id="yesBtn">

Sounds Fun 😄

</button>


<button id="noBtn">

Maybe Later 🙈

</button>


</div>



<footer>

Made with ☕ and a little courage.

</footer>


</div>
<script>

/* ============================= */
/* Floating Emojis               */
/* ============================= */


const emojis=[

"☕",
"✨",
"🌸",
"😊",
"🍔",
"🍟",
"🌿",
"🎮",
"🎳",
"🍰",
"😄",
"🌤️"

];



for(let i=0;i<25;i++){

    const e=document.createElement("div");

    e.className="float";


    e.innerHTML =
    emojis[Math.floor(Math.random()*emojis.length)];


    e.style.left =
    Math.random()*100+"vw";


    e.style.fontSize =
    (18+Math.random()*22)+"px";


    e.style.animationDuration =
    (6+Math.random()*8)+"s";


    document.body.appendChild(e);

}



/* ============================= */
/* Elements                      */
/* ============================= */


const title=document.getElementById("title");

const text=document.getElementById("text");

const buttons=document.getElementById("buttons");

const yesBtn=document.getElementById("yesBtn");

const noBtn=document.getElementById("noBtn");




/* ============================= */
/* Story                         */
/* ============================= */


const pages=[

{

title:"Hey 😊",

text:"I wanted to tell you something..."

},


{

title:"Remember our first hangout?",

text:"I genuinely had a really good time."

},


{

title:"I kept thinking about it.",

text:"You made the day really enjoyable, and it honestly left me looking forward to meeting you again."

},


{

title:"So...",

text:"I thought instead of just thinking about it... why not ask?"

}

];



let page=0;

let story=null;



function changePage(){


    if(page < pages.length){


        title.classList.remove("fade");

        text.classList.remove("fade");


        void title.offsetWidth;


        title.classList.add("fade");

        text.classList.add("fade");



        title.innerHTML =
        pages[page].title;



        text.innerHTML =
        pages[page].text;



        page++;


    }


    else{


        clearInterval(story);



        title.innerHTML =
        "One Last Question 😊";



        text.innerHTML = `

I really enjoyed spending time with you.

I'd love to make another memory together.

No pressure.

No expectations.

Just good food,
good conversations,
and hopefully lots of laughs.

`;



        buttons.style.display="block";

        buttons.classList.add("fade");


    }


}



changePage();


story=setInterval(changePage,2800);





/* ============================= */
/* Funny No Button               */
/* ============================= */


let count=0;

let yesSize=22;



const funnyMessages=[

"Thinking... 🤔",

"Coffee? ☕",

"Free fries? 🍟",

"Pretty please? 🥹",

"It'll be fun 😄",

"Adventure awaits 🌸",

"I'll let you pick the place 😌",

"Still deciding? 😂",

"Just one hangout 🙈",

"Okay okay 😂"

];





function moveButton(){



    if(count>=6){


        noBtn.style.position="relative";

        noBtn.style.left="0";

        noBtn.style.top="0";

        noBtn.innerHTML="Okay 😂";


        return;

    }





    noBtn.style.position="fixed";



    const maxX=Math.max(

        20,

        window.innerWidth -
        noBtn.offsetWidth -
        40

    );



    const maxY=Math.max(

        20,

        window.innerHeight -
        noBtn.offsetHeight -
        40

    );




    noBtn.style.left =

    Math.random()*maxX+"px";



    noBtn.style.top =

    Math.random()*maxY+"px";



    noBtn.innerHTML =

    funnyMessages[count];



    count++;



    yesSize +=5;



    yesBtn.style.fontSize =

    yesSize+"px";



    yesBtn.style.padding =

    (16+count*2)+"px "+

    (35+count*3)+"px";



}





/* Desktop */

noBtn.addEventListener(

"mouseenter",

moveButton

);



/* Modern browsers */

noBtn.addEventListener(

"pointerover",

moveButton

);



/* Mobile */

noBtn.addEventListener(

"touchstart",

(e)=>{

    e.preventDefault();

    moveButton();

}

);



noBtn.addEventListener(

"click",

(e)=>{

    e.preventDefault();

    moveButton();

}

);





/* ============================= */
/* Yes Button Effect             */
/* ============================= */


yesBtn.addEventListener(

"mouseenter",

()=>{


yesBtn.animate(

[

{

transform:"scale(1)"

},

{

transform:"scale(1.08)"

},

{

transform:"scale(1)"

}

],


{

duration:500

}

);


}

);





/* ============================= */
/* YES CLICK                     */
/* ============================= */


yesBtn.addEventListener(

"click",

showSuccess

);



</script>
<script>

/* ============================= */
/* SUCCESS PAGE                  */
/* ============================= */


function showSuccess(){


/* Celebration */

for(let i=0;i<120;i++){


    let emoji=document.createElement("div");


    emoji.innerHTML =
    emojis[Math.floor(Math.random()*emojis.length)];



    emoji.style.position="fixed";

    emoji.style.left =
    Math.random()*100+"vw";


    emoji.style.top="-40px";


    emoji.style.fontSize =
    (20+Math.random()*25)+"px";


    emoji.style.pointerEvents="none";

    emoji.style.zIndex="9999";



    document.body.appendChild(emoji);



    emoji.animate(

    [

        {

            transform:
            "translateY(0px) rotate(0deg)",

        },


        {

            transform:
            `translateY(${window.innerHeight+200}px) rotate(720deg)`,

            opacity:0

        }


    ],

    {

        duration:
        2500+Math.random()*1500

    }


    );



    setTimeout(()=>{

        emoji.remove();

    },4500);



}





setTimeout(()=>{


document.body.innerHTML = `

.choice{

.choice{

</style>





<div class="success">



<h1 style="

color:#1e3a8a;

font-size:clamp(2rem,7vw,4rem);

">

🎉 Yay!!

</h1>





<img

src="https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif"

style="width:280px;border-radius:22px;margin-top:20px;"

>





<h2 style="

margin-top:25px;

color:#1e3a8a;

">

You said YES! ☕✨

</h2>





<p style="

font-size:1.15rem;

line-height:1.8;

color:#555;

">

Now comes the difficult part...

<br>

Where should we go? 😄

</p>





<div class="choice">


<button onclick="finish('☕ Coffee')">

☕ Coffee

</button>


<button onclick="finish('🍜 Food')">

🍜 Food

</button>


<button onclick="finish('🎳 Bowling')">

🎳 Bowling

</button>


<button onclick="finish('🎮 Arcade')">

🎮 Arcade

</button>


<button onclick="finish('🌳 A Walk')">

🌳 Walk

</button>


<button onclick="finish('🍰 Dessert')">

🍰 Dessert

</button>


</div>





<div id="result">


<h2 style="color:#2563eb;">

Excellent Choice! 😄

</h2>





<p style="line-height:1.9;color:#555;">


Looks like our second hangout already has a plan.


<br><br>


Now all that's left...

is finding a day we're both free.


<br><br>


I'm really looking forward to spending time with you again.


😊🌿


</p>






<div style="

margin-top:25px;

background:#edf4ff;

padding:22px;

border-radius:20px;

">


<h3 style="color:#2563eb;">

📜 Patch Notes v2.0

</h3>



<p style="line-height:2;color:#555;">


✅ Round Two Confirmed

<br>

☕ Hangout Accepted

<br>

🌸 Memory #2 Loading...

<br>

😂 Excitement +100%

<br>

✨ Looking forward to seeing you again


</p>


</div>



</div>



</div>



`;



},2500);



}




/* FIXED finish function */

window.finish=function(place){


document.querySelector(".choice").style.display="none";


document.getElementById("result").style.display="block";



document.querySelector("#result h2").innerHTML =

place+" Selected! 🎉";


};



</script>


</body>

</html>
